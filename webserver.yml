name: update web servers
hosts: webservers
remote_user: root

tasks:
  - name: Ensure apache is at the lastest version
    ansible.builtin.yum:
      name: httpd
      state: latest
  - name: write the apache config file
    ansible.builtin.template:
      src: httpd.conf.j2
      dest: /etc/httpd/conf/httpd.conf
